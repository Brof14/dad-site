<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#efe9df">
    <meta name="description" content="С днём рождения, папа. Семейный фильм и несколько слов от близких.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="С днём рождения, папа!">
    <meta property="og:description" content="Семейный фильм и поздравление для папы.">
    <title>С днём рождения, папа!</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/poster.jpg" as="image" fetchpriority="high">
    <link rel="preload" href="assets/fonts/eb-garamond-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell" id="top">
      <section class="hero" id="film" aria-labelledby="page-title">
        <header class="masthead container">
          <a class="wordmark" href="#top" aria-label="Для папы. На начало страницы.">Для папы</a>
          <a class="masthead__link" href="#wish">Поздравление <span aria-hidden="true">↘</span></a>
        </header>

        <div class="hero__media">
          <video
            id="greeting-video"
            controls
            playsinline
            preload="none"
            width="1920"
            height="1080"
            poster="assets/poster.jpg"
            aria-label="Поздравительное видео для папы"
          >
            <source src="assets/papa-greeting.mp4" type="video/mp4">
            Ваш браузер не поддерживает воспроизведение видео. Откройте сайт в актуальном браузере.
          </video>
          <div class="hero__veil" aria-hidden="true"></div>

          <div class="hero__title-wrap">
            <h1 id="page-title">С днём<br>рождения,<br><span>папа.</span></h1>
          </div>

          <button class="film__play" type="button" aria-label="Смотреть поздравление" aria-controls="greeting-video" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 5.7c0-.8.9-1.2 1.5-.8l9.1 6.2a1.1 1.1 0 0 1 0 1.8l-9.1 6.2c-.6.4-1.5 0-1.5-.8V5.7Z" fill="currentColor"/>
            </svg>
            <span>Смотреть фильм</span>
          </button>
          <p class="film__status" role="status" aria-live="polite" hidden></p>
          <p class="film__orientation" role="status" aria-live="polite" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M7 3.75h7.5a2 2 0 0 1 2 2v5.1M17 20.25H9.5a2 2 0 0 1-2-2v-5.1M4.6 9.9A8 8 0 0 1 18 5.2l1.5 1.7m0 0-.1-3.3m.1 3.3-3.3-.4M19.4 14.1A8 8 0 0 1 6 18.8l-1.5-1.7m0 0 .1 3.3m-.1-3.3 3.3.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/>
            </svg>
            <span>Поверните телефон горизонтально</span>
          </p>

          <div class="hero__meta" aria-label="Продолжительность: 1 минута 25 секунд">
            <span class="hero__meta-rule" aria-hidden="true"></span>
            <span>Семейный фильм</span>
            <span class="hero__meta-time">01:25</span>
          </div>
          <a class="hero__scroll" href="#wish" aria-label="Перейти к поздравлению">
            <span>Поздравление ниже</span>
            <span class="hero__scroll-arrow" aria-hidden="true">↓</span>
          </a>
        </div>
      </section>

      <section class="closing container" id="wish" aria-labelledby="wish-title">
        <div class="closing__mark" aria-hidden="true">02</div>
        <div class="closing__copy">
          <h2 id="wish-title">Пап, с днём рождения.</h2>
          <p>Желаю тебе здоровья, сил и удачи. Пусть всё, за что берёшься, получается.</p>
        </div>
        <a class="closing__top" href="#top">В начало <span aria-hidden="true">↑</span></a>
      </section>
    </main>
  </body>
</html>
